services:
  db:
    image: postgres:18
    environment: {POSTGRES_USER: unnamed_tracking_dev, POSTGRES_PASSWORD: unnamed_tracking_dev, POSTGRES_DB: unnamed_tracking_dev}
    ports: ["127.0.0.1:55432:5432"]
    volumes: [unnamed_tracking_dev_pgdata:/var/lib/postgresql]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U unnamed_tracking_dev -d unnamed_tracking_dev"], interval: 3s, timeout: 3s, retries: 20}
  backend:
    build: {context: ./src/backend, dockerfile: dockerfile}
    environment:
      POSTGRES_USER: unnamed_tracking_dev
      POSTGRES_PASSWORD: unnamed_tracking_dev
      POSTGRES_DB: unnamed_tracking_dev
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      STARTUP_MODE: dev
      DEBUG: "true"
      AUTH_COOKIE_SECURE: "false"
      SECRET_KEY: dev-only-secret-key
      PYTHONUNBUFFERED: "1"
    volumes: [./src/backend/src:/app/src, ./src/backend/tests:/app/tests, ./data-dev:/data]
    command: sh -c "alembic upgrade heads && uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["127.0.0.1:8000:8000"]
    depends_on: {db: {condition: service_healthy}}
    healthcheck: {test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health >/dev/null"], interval: 5s, timeout: 3s, retries: 20}
  frontend:
    build: {context: ./src/frontend, dockerfile: Dockerfile}
    environment: {VITE_USE_MOCK_DATA: "false"}
    ports: ["127.0.0.1:5173:80"]
    volumes: [./src/frontend:/app, /app/node_modules]
    depends_on: {backend: {condition: service_healthy}}
volumes:
  unnamed_tracking_dev_pgdata:
