name: Build and test production Docker container

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  packages: write


jobs:
  Package-Production-Container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Dynamically derive repo name (lowercase)
      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set production image tags
        run: |
          IMAGE_NAME="ghcr.io/${REPO_LC}"
          IMAGE_TAG="$(printf '%s' "$GITHUB_REF_NAME" | tr '/:' '-')"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/docker-container/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=production-container
          cache-to: type=gha,mode=max,scope=production-container

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          docker logs unnamed-tracking-app || true
          docker logs unnamed-tracking-db || true
