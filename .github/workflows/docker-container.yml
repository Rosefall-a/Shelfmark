name: Build and test production Docker container

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  packages: write


jobs:
  Package-Production-Container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Dynamically derive repo name (lowercase)
      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set production image tags
        run: |
          IMAGE_NAME="ghcr.io/${REPO_LC}"
          IMAGE_TAG="$(printf '%s' "$GITHUB_REF_NAME" | tr '/:' '-')"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Build production image
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker buildx build --progress=plain --load --file src/docker-container/Dockerfile --tag unnamed_tracking_app:ci . 2>&1 | tee docker-build.log
          else
            docker buildx build --progress=plain --push --file src/docker-container/Dockerfile \
              --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
              --tag "${IMAGE_NAME}:sha-${GITHUB_SHA}" . 2>&1 | tee docker-build.log
          fi

      - name: Upload Docker build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-docker-build-log-${{ github.run_id }}
          path: docker-build.log
          if-no-files-found: warn

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          docker logs unnamed-tracking-app || true
          docker logs unnamed-tracking-db || true
