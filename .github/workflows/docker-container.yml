name: Build and test production Docker container

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read
  packages: write


jobs:
  Package-Production-Container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Compose configurations
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f src/docker-container/compose.yaml config --quiet
          docker compose -f src/docker-container/compose.debug.yaml config --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Dynamically derive repo name (lowercase)
      - name: Set lowercase repository name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build production image for smoke tests
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/docker-container/Dockerfile
          load: true
          tags: unnamed_tracking_app:ci
          cache-from: type=gha,scope=production-container
          cache-to: type=gha,mode=max,scope=production-container

          
      - name: Publish production image
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          # Dynamic GHCR image name
          IMAGE_NAME="ghcr.io/${REPO_LC}"

          # Tag formatting
          IMAGE_TAG="$(printf '%s' "$GITHUB_REF_NAME" | tr '/:' '-')"

          # Tag and push
          docker tag unnamed_tracking_app:ci "$IMAGE_NAME:$IMAGE_TAG"
          docker tag unnamed_tracking_app:ci "$IMAGE_NAME:sha-$GITHUB_SHA"

          docker push "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:sha-$GITHUB_SHA"

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker ps -a
          docker logs unnamed-tracking-app || true
          docker logs unnamed-tracking-db || true
