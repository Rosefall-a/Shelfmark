name: Backend checks

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  backend-checks:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: unnamed_tracking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d unnamed_tracking_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: src/backend

    env:
      PYTHONPATH: ${{ github.workspace }}/src/backend
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/unnamed_tracking_test
      PRIMARY_USER_USERNAME: test
      PRIMARY_USER_EMAIL: test@example.com
      PRIMARY_USER_PASSWORD: test-password
      SECRET_KEY: XJVqc8r7Uj801VzGUYhlQV8A2tZTBepjOYEiP2pTzFk=

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare test database
        run: alembic upgrade head

      - name: Run tests
        run: pytest

      - name: Validate Alembic migration graph
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          versions = Path("src/database/migrations/versions")
          revisions = {}
          for path in sorted(versions.glob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              revision = None
              down_revision = None
              for node in tree.body:
                  if isinstance(node, ast.AnnAssign) and isinstance(node.target, ast.Name):
                      name = node.target.id
                      if name in {"revision", "down_revision"}:
                          value = ast.literal_eval(node.value)
                          if name == "revision":
                              revision = value
                          else:
                              down_revision = value
                  elif isinstance(node, ast.Assign):
                      for target in node.targets:
                          if isinstance(target, ast.Name) and target.id in {"revision", "down_revision"}:
                              value = ast.literal_eval(node.value)
                              if target.id == "revision":
                                  revision = value
                              else:
                                  down_revision = value
              if revision:
                  parents = [] if down_revision is None else list(down_revision) if isinstance(down_revision, tuple) else [down_revision]
                  revisions[revision] = (path.name, parents)

          print("Loaded", len(revisions), "Alembic revisions")
          missing = sorted({parent for _, parents in revisions.values() for parent in parents if parent not in revisions})
          if missing:
              raise SystemExit(f"Missing Alembic parent revisions: {missing}")

          state = {}
          stack = []

          def visit(revision):
              state[revision] = 1
              stack.append(revision)
              for parent in revisions[revision][1]:
                  if state.get(parent) == 1:
                      cycle_start = stack.index(parent)
                      cycle = stack[cycle_start:] + [parent]
                      print("Alembic cycle detected:")
                      for item in cycle:
                          print("  ", item, "<-", revisions[item][1])
                      raise SystemExit("Alembic migration graph contains a cycle")
                  if state.get(parent, 0) == 0:
                      visit(parent)
              stack.pop()
              state[revision] = 2

          for revision in revisions:
              if state.get(revision, 0) == 0:
                  visit(revision)

          children = {revision: 0 for revision in revisions}
          for _, parents in revisions.values():
              for parent in parents:
                  children[parent] += 1
          heads = sorted(revision for revision, count in children.items() if count == 0)
          print("Alembic heads:", heads)
          if len(heads) != 1:
              raise SystemExit(f"Expected exactly one Alembic head, found {len(heads)}: {heads}")
          PY

      - name: Run mypy
        run: mypy --config-file pyproject.toml src

      - name: Run pylint
        run: |
          pylint src | tee pylint-output.txt
          score=$(grep -oP 'Your code has been rated at \K[0-9.]+(?=/10)' pylint-output.txt)
          echo "Pylint score: $score"
          python -c "import sys; sys.exit(0 if float('$score') >= 9.0 else 1)"
