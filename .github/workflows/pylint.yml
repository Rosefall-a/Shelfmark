name: pylint

on:
  push:
    paths:
      - "src/backend/**"
  pull_request:
    paths:
      - "src/backend/**"
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pylint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Pylint
        run: pylint src --disable=duplicate-code --score=y | tee pylint-output.txt

      - name: Enforce 10.00/10.00 score
        run: |
          score=$(grep -oP 'Your code has been rated at \K[0-9.]+(?=/10)' pylint-output.txt)
          echo "Pylint score: $score"
          test "$score" = "10.00"
