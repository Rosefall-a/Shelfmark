name: pylint

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pylint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Pylint
        run: |
          set -o pipefail
          mapfile -t pylint_files < <(find src -type f -name '*.py' ! -path 'src/api/schemas/movie.py' -print)
          pylint "${pylint_files[@]}" --score=y | tee pylint-output.txt

      - name: Run Pylint with movie schema exception
        run: |
          pylint src/api/schemas/movie.py --disable=duplicate-code --score=y | tee pylint-movie-output.txt

      - name: Enforce 10.00/10.00 score
        run: |
          main_score=$(awk '/Your code has been rated at/{score=$7} END{print score}' pylint-output.txt)
          movie_score=$(awk '/Your code has been rated at/{score=$7} END{print score}' pylint-movie-output.txt)
          main_score=${main_score%/10}
          movie_score=${movie_score%/10}
          echo "Pylint main score: ${main_score:-unavailable}/10"
          echo "Pylint movie schema score: ${movie_score:-unavailable}/10"
          test "$main_score" = "10.00"
          test "$movie_score" = "10.00"
