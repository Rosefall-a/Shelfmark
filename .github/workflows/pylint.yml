name: pylint

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pylint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Pylint
        run: |
          set -o pipefail
          normal_files=()
          exception_files=()
          while IFS= read -r file; do
            if grep -Eq '^# pylint: disable=.*duplicate-code' "$file"; then
              exception_files+=("$file")
            else
              normal_files+=("$file")
            fi
          done < <(find src -type f -name '*.py' -print)
          pylint "${normal_files[@]}" --score=y | tee pylint-output.txt
          for file in "${exception_files[@]}"; do
            pylint "$file" --disable=duplicate-code --score=y | tee -a pylint-output.txt
          done

      - name: Enforce 10.00/10.00 score
        run: |
          scores=$(grep 'Your code has been rated at' pylint-output.txt | awk '{print $7}' | sed 's#/10##')
          echo "$scores"
          test -n "$scores"
          if echo "$scores" | grep -qv '^10\.00$'; then
            echo "One or more Pylint invocations scored below 10.00"
            exit 1
          fi
