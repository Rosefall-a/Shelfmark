name: pylint

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pylint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Pylint
        run: |
          set -o pipefail
          pylint src --score=y | tee pylint-output.txt

      - name: Enforce 10.00/10.00 score
        run: |
          score=$(grep -oP 'Your code has been rated at \K[0-9]+\.[0-9]+(?=/10)' pylint-output.txt | tail -n 1)
          echo "Pylint score: ${score:-unavailable}/10"
          test "$score" = "10.00"
