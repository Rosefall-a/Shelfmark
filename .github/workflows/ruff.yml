name: Ruff

on:
  push:
    paths:
      - "src/backend/**"
      - ".github/workflows/ruff.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/backend/**"

permissions:
  contents: write

jobs:
  # -------------------------
  # 1. Ruff Format Job
  # -------------------------
  ruff-format:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff format
        run: ruff format .

      - name: Commit formatting changes
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "chore(ruff): apply formatting fixes"
          git push origin HEAD:${GITHUB_REF_NAME}

  # -------------------------
  # 2. Ruff Auto-Fix Job
  # -------------------------
  ruff-autofix:
    needs: ruff-format
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Ruff Safe Auto-Fixes
        run: ruff check . --fix || true

      - name: Commit Ruff safe fixes
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Remove temporary workflow if present
          if [ -f ".github/workflows/temporary-ruff-fix.yml" ]; then
            git rm .github/workflows/temporary-ruff-fix.yml
          fi

          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "fix(ruff): apply safe auto-fixes"
          git push origin HEAD:${GITHUB_REF_NAME}

  # -------------------------
  # 3. Ruff Lint Job
  # -------------------------
  ruff-lint:
    needs: ruff-autofix
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Run Ruff lint (with GitHub annotations)
        run: ruff check . --output-format=github
