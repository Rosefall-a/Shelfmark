name: Validate developer control container

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  Devcontainer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build developer control image
        uses: docker/build-push-action@v6
        with:
          context: src/devcontainer
          file: src/devcontainer/Dockerfile
          load: true
          tags: unnamed_tracking_app:devcontainer-ci
          cache-from: type=gha,scope=devcontainer
          cache-to: type=gha,mode=max,scope=devcontainer

      - name: Run control-container unit tests
        run: |
          docker run --rm --entrypoint python3 unnamed_tracking_app:devcontainer-ci             -m unittest discover -s /opt/devcontainer/tests -p 'test_*.py'

      - name: Build wiki with the devcontainer toolchain
        run: |
          docker run --rm --entrypoint mkdocs             -v "$PWD:/workspace:ro"             unnamed_tracking_app:devcontainer-ci             build -f /workspace/wiki/mkdocs.yml --site-dir /tmp/site --clean

      - name: Validate Compose syntax
        run: |
          docker compose -f src/devcontainer/compose.yaml config --quiet
          docker compose -f src/devcontainer/compose.dev.yaml config --quiet --no-interpolate --no-path-resolution
          docker compose -f src/devcontainer/compose.prod.yaml config --quiet --no-interpolate --no-path-resolution
