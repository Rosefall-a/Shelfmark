name: Validate developer control container

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  Devcontainer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build developer control image
        uses: docker/build-push-action@v6
        with:
          context: src/devcontainer
          file: src/devcontainer/Dockerfile
          load: true
          tags: unnamed_tracking_app:devcontainer-ci
          cache-from: type=gha,scope=devcontainer
          cache-to: type=gha,mode=max,scope=devcontainer

      - name: Run control-container unit tests
        run: docker run --rm --entrypoint python3 unnamed_tracking_app:devcontainer-ci -m unittest discover -s /opt/devcontainer/tests -p 'test_*.py'

      - name: Validate Compose syntax
        run: |
          docker compose -f src/devcontainer/compose.yaml config --quiet
          docker compose -f src/devcontainer/compose.dev.yaml config --quiet --no-interpolate --no-path-resolution
          docker compose -f src/devcontainer/compose.prod.yaml config --quiet --no-interpolate --no-path-resolution
          grep -q 'context: ../..' src/devcontainer/compose.prod.yaml

      - name: Smoke test development deployment
        run: |
          cat > /tmp/devcontainer-ci.env <<'EOF'
          DEV_POSTGRES_USER=unnamed_tracking
          DEV_POSTGRES_PASSWORD=debug-password
          DEV_POSTGRES_DB=unnamed_tracking
          DEV_SECRET_KEY=devcontainer-ci
          DEV_PRIMARY_USER_USERNAME=admin
          DEV_PRIMARY_USER_EMAIL=admin@example.invalid
          DEV_PRIMARY_USER_PASSWORD=debug-password
          DEV_AUTH_COOKIE_SECURE=false
          DEVCONTAINER_APP_PORT=5173
          DEV_PULL_POLICY=build
          IMAGE_TAG=ci
          EOF
          trap 'docker compose --env-file /tmp/devcontainer-ci.env -p devcontainer-ci -f src/devcontainer/compose.dev.yaml down --volumes --remove-orphans' EXIT
          docker compose --env-file /tmp/devcontainer-ci.env -p devcontainer-ci -f src/devcontainer/compose.dev.yaml up -d --build --wait --wait-timeout 180
          curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:5173/
          docker compose --env-file /tmp/devcontainer-ci.env -p devcontainer-ci -f src/devcontainer/compose.dev.yaml ps

      - name: Validate production Dockerfile
        run: docker build --check -f src/docker-container/Dockerfile .
