name: Temporary Ruff Fix

on:
  push:
    branches:
      - maintenance/backend-ruff-thing

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install ruff
      - name: Apply safe Ruff fixes
        run: ruff check . --fix
      - name: Commit Ruff fixes and remove temporary workflow
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-ruff-fix.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(ruff): apply Ruff safe fixes"
          git push origin HEAD:${GITHUB_REF_NAME}
