name: Production runtime smoke tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/backend/**"
      - "src/frontend/**"
      - "src/docker-container/**"
      - ".github/workflows/docker-container.yml"
      - ".github/workflows/production-runtime-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"
  workflow_run:
    workflows: ["Build and test production Docker container"]
    types: [completed]
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  runtime-smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        if: github.event_name != 'workflow_run'
        uses: docker/setup-buildx-action@v3

      - name: Build production image for runtime validation
        if: github.event_name != 'workflow_run'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/docker-container/Dockerfile
          load: true
          tags: unnamed_tracking_app:runtime-smoke
          cache-from: type=gha,scope=production-runtime-smoke
          cache-to: type=gha,mode=max,scope=production-runtime-smoke

      - name: Pull the exact published production image
        if: github.event_name == 'workflow_run'
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE"
          docker tag "$IMAGE" unnamed_tracking_app:runtime-smoke

      - name: Run production runtime smoke tests
        env:
          SMOKE_IMAGE: unnamed_tracking_app:runtime-smoke
          SMOKE_PROJECT_NAME: unnamed-tracking-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/production-runtime-smoke
        run: bash src/docker-container/smoke/run.sh

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-runtime-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/production-runtime-smoke
          if-no-files-found: warn
          retention-days: 14
