name: Feature request
description: Suggest an improvement or new feature.
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please focus on the problem the feature would solve and how you would like it to work.

  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What problem would this feature solve, or what use case would it support?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or experience you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternative solutions, workarounds, or existing approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, examples, links, or other information that would help explain the request.
