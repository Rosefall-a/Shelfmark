name: Task / maintenance
description: Track internal development, maintenance, or cleanup work.
title: "[TASK] "
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: reason
    attributes:
      label: Why is this needed?
      description: Explain the purpose, problem, or expected benefit.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant links, implementation notes, constraints, or other context.
