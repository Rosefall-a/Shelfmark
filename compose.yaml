services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ./src/backend
      dockerfile: dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PYTHONUNBUFFERED: 1
      STARTUP_MODE: ${STARTUP_MODE:-} # dev/development skips post-install setup; testing uses testing/development defaults with setup UI; empty/other uses normal defaults with setup UI
    env_file:
      - .env
    volumes:
      - ./src/backend/src:/app/src
      - ./data:/data
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "5173:80"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
