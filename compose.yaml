services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - core
  backend:
    build:
      context: ./src/backend
      dockerfile: dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PYTHONUNBUFFERED: 1
      STARTUP_MODE: ${STARTUP_MODE:-} # dev/development skips post-install setup; testing uses testing/development defaults with setup UI; empty/other uses normal defaults with setup UI
      PLUGIN_RUNTIME_URL: http://plugin-runtime:8000
      PLUGIN_RUNTIME_TOKEN: ${PLUGIN_RUNTIME_TOKEN:?Set PLUGIN_RUNTIME_TOKEN in .env}
    env_file:
      - .env
    volumes:
      - ./src/backend/src:/app/src
      - ./data:/data
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - core
      - plugin_gateway

  plugin-runtime:
    build:
      context: .
      dockerfile: src/plugin-runtime/Dockerfile
    restart: unless-stopped
    environment:
      PLUGIN_RUNTIME_TOKEN: ${PLUGIN_RUNTIME_TOKEN:?Set PLUGIN_RUNTIME_TOKEN in .env}
      PLUGIN_RUNTIME_HOST: 0.0.0.0
      PLUGIN_RUNTIME_PORT: "8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    expose:
      - "8000"
    volumes:
      - plugin_data:/var/lib/unnamed-tracking/plugins
    networks:
      - plugin_gateway
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8000/health" ]
      interval: 10s
      timeout: 3s
      start_period: 2s
      retries: 3

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "5173:80"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - core
  #app:
  #  build:
  #    context: .
  #    dockerfile: ./src/docker-container/Dockerfile
  #  restart: unless-stopped
  #  ports:
  #    - "${UNNAMED_TRACKING_APP_PORT:-5181}:80"
  #  env_file:
  #    - .env
  #  environment:
  #    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  #    PYTHONUNBUFFERED: 1
  #  stdin_open: true
  #  tty: true

volumes:
  pgdata:
  plugin_data:

networks:
  core:
  plugin_gateway:
    internal: true
