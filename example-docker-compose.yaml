services:
  app:
    #image: ghcr.io/rosefall-a/unnamed_tracking_app:feat-central-config-handler
    build:
      context: .
      dockerfile: ./src/docker-container/Dockerfile
    restart: unless-stopped
    ports:
      - "${UNNAMED_TRACKING_APP_PORT:-8080}:80"
    env_file:
      - .env
    volumes:
      - ./data:/data
    networks:
      - core
      - plugin_gateway

  plugin-runtime:
    build:
      context: .
      dockerfile: src/plugin-runtime/Dockerfile
    restart: unless-stopped
    environment:
      PLUGIN_RUNTIME_TOKEN: ${PLUGIN_RUNTIME_TOKEN:?Set PLUGIN_RUNTIME_TOKEN in .env}
      PLUGIN_RUNTIME_HOST: 0.0.0.0
      PLUGIN_RUNTIME_PORT: "8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    expose:
      - "8000"
    volumes:
      - plugin_data:/var/lib/unnamed-tracking/plugins
    networks:
      - plugin_gateway
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8000/health" ]
      interval: 10s
      timeout: 3s
      start_period: 2s
      retries: 3

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unnamed_tracking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-unnamed_tracking}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unnamed_tracking} -d ${POSTGRES_DB:-unnamed_tracking}" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - core
volumes:
  pgdata:
  plugin_data:
networks:
  core:
  plugin_gateway:
    internal: true
