[tool.mypy]
python_version = "3.12"
mypy_path = "."
files = ["src"]
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["src/database/migrations/.*"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.pylint.main]
py-version = "3.12"
source-roots = ["src"]
ignore = ["__pycache__", "migrations"]

[tool.pylint.messages_control]
# These individual checks are intentionally excluded where they conflict with the
# project's existing architecture or duplicate formatting responsibilities handled
# elsewhere. Functional/security diagnostics remain enabled.
disable = [
  "import-error",
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "line-too-long",
  "multiple-statements",
  "duplicate-code",
  "too-many-arguments",
  "too-many-positional-arguments",
  "too-many-locals",
  "too-many-instance-attributes",
  "too-few-public-methods",
  "broad-exception-caught",
  "global-statement",
  "unsubscriptable-object",
  "not-callable",
]


[tool.pylint.format]
max-line-length = 120

[tool.pylint.design]
max-args = 6
