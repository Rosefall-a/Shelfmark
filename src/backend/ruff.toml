line-length = 100

target-version = "py312"

[lint]
select = [
    "E", # pycodestyle errors
    "F", # pyflakes
    "I", # import sorting
    "W", # warnings
    "B", # bugbear
]
ignore = [
    "E501", # let black/ruff format handle line length
]

[lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.File",
]

[format]
quote-style = "double"
indent-style = "space"
