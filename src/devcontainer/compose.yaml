services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${DEVCONTAINER_CONTROL_PORT:-9000}:9000"
      - "127.0.0.1:${DEVCONTAINER_DOCS_PORT:-999}:999"
    environment:
      DEVCONTAINER_WORKSPACE: /workspace
      DEVCONTAINER_CONTROL_PORT: 9000
      DEVCONTAINER_DOCS_PORT: 999
      DEVCONTAINER_DEV_PROJECT: uta-debug-dev
      DEVCONTAINER_PROD_PROJECT: uta-debug-prod
      DEVCONTAINER_PROD_PORT: ${DEVCONTAINER_PROD_PORT:-8180}
      DEVCONTAINER_DEV_PORT: ${DEVCONTAINER_DEV_PORT:-5173}
      UNNAMED_TRACKING_APP_VERSION: ${UNNAMED_TRACKING_APP_VERSION:-latest}
      DEBUG_POSTGRES_USER: ${DEBUG_POSTGRES_USER:-unnamed_tracking}
      DEBUG_POSTGRES_PASSWORD: ${DEBUG_POSTGRES_PASSWORD:-debug-password}
      DEBUG_POSTGRES_DB: ${DEBUG_POSTGRES_DB:-unnamed_tracking}
      DEBUG_PROD_POSTGRES_USER: ${DEBUG_PROD_POSTGRES_USER:-unnamed_tracking}
      DEBUG_PROD_POSTGRES_PASSWORD: ${DEBUG_PROD_POSTGRES_PASSWORD:-debug-password}
      DEBUG_PROD_POSTGRES_DB: ${DEBUG_PROD_POSTGRES_DB:-unnamed_tracking}
      DEBUG_PROD_SECRET_KEY: ${DEBUG_PROD_SECRET_KEY:-devcontainer-not-for-production}
      DEBUG_PROD_PRIMARY_USER_PASSWORD: ${DEBUG_PROD_PRIMARY_USER_PASSWORD:-debug-admin-password}
      PRIMARY_USER_USERNAME: ${PRIMARY_USER_USERNAME:-admin}
      PRIMARY_USER_EMAIL: ${PRIMARY_USER_EMAIL:-admin@example.invalid}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../..:/workspace:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
