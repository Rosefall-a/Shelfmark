services:
  devcontainer:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${DEVCONTAINER_CONTROL_PORT:-9000}:9000"
      - "127.0.0.1:${DEVCONTAINER_DOCS_PORT:-999}:999"
    environment:
      DEVCONTAINER_WORKSPACE: /workspace
      DEVCONTAINER_CONTROL_PORT: 9000
      DEVCONTAINER_DOCS_PORT: 999
      DEVCONTAINER_DEV_PROJECT: uta-debug-dev
      DEVCONTAINER_PROD_PROJECT: uta-debug-prod
      DEVCONTAINER_PROD_PORT: ${DEVCONTAINER_PROD_PORT:-8180}
      DEVCONTAINER_DEV_PORT: ${DEVCONTAINER_DEV_PORT:-5173}
      DEV_POSTGRES_USER: ${DEV_POSTGRES_USER:-unnamed_tracking}
      DEV_POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-debug-password}
      DEV_POSTGRES_DB: ${DEV_POSTGRES_DB:-unnamed_tracking}
      DEV_SECRET_KEY: ${DEV_SECRET_KEY:-devcontainer-not-for-production}
      DEV_PRIMARY_USER_USERNAME: ${DEV_PRIMARY_USER_USERNAME:-admin}
      DEV_PRIMARY_USER_EMAIL: ${DEV_PRIMARY_USER_EMAIL:-admin@example.invalid}
      DEV_PRIMARY_USER_PASSWORD: ${DEV_PRIMARY_USER_PASSWORD:-debug-admin-password}
      DEV_AUTH_COOKIE_SECURE: ${DEV_AUTH_COOKIE_SECURE:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../..:/workspace:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
