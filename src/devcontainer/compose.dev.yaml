name: uta-debug-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DEV_POSTGRES_USER:-unnamed_tracking}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-debug-password}
      POSTGRES_DB: ${DEV_POSTGRES_DB:-unnamed_tracking}
    volumes:
      - devcontainer_dev_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEV_POSTGRES_USER:-unnamed_tracking} -d ${DEV_POSTGRES_DB:-unnamed_tracking}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
      dockerfile: dockerfile
    environment:
      POSTGRES_USER: ${DEV_POSTGRES_USER:-unnamed_tracking}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-debug-password}
      POSTGRES_DB: ${DEV_POSTGRES_DB:-unnamed_tracking}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      PYTHONUNBUFFERED: 1
      STARTUP_MODE: dev
    volumes:
      - devcontainer_dev_data:/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${DEVCONTAINER_DEV_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  devcontainer_dev_pgdata:
  devcontainer_dev_data:
