name: uta-debug-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DEBUG_POSTGRES_USER:-unnamed_tracking}
      POSTGRES_PASSWORD: ${DEBUG_POSTGRES_PASSWORD:-debug-password}
      POSTGRES_DB: ${DEBUG_POSTGRES_DB:-unnamed_tracking}
    volumes:
      - devcontainer_dev_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEBUG_POSTGRES_USER:-unnamed_tracking} -d ${DEBUG_POSTGRES_DB:-unnamed_tracking}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: /workspace/src/backend
      dockerfile: dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${DEBUG_POSTGRES_USER:-unnamed_tracking}:${DEBUG_POSTGRES_PASSWORD:-debug-password}@db:5432/${DEBUG_POSTGRES_DB:-unnamed_tracking}
      PYTHONUNBUFFERED: 1
      STARTUP_MODE: dev
    volumes:
      - devcontainer_dev_data:/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: /workspace/src/frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_BASE_URL: ""
    ports:
      - "127.0.0.1:${DEVCONTAINER_DEV_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  devcontainer_dev_pgdata:
  devcontainer_dev_data
