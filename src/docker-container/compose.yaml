services:
  app:
    image: ghcr.io/rosefall-a/unnamed_tracking_app:${UNNAMED_TRACKING_APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${UNNAMED_TRACKING_APP_PORT:-8080}:80"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-unnamed_tracking}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-unnamed_tracking}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      PRIMARY_USER_USERNAME: ${PRIMARY_USER_USERNAME:-admin}
      PRIMARY_USER_EMAIL: ${PRIMARY_USER_EMAIL:-admin@example.invalid}
      PRIMARY_USER_PASSWORD: ${PRIMARY_USER_PASSWORD:?Set PRIMARY_USER_PASSWORD in .env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    volumes:
      - ./data:/data

  plugin-runtime:
    build:
      context: ../..
      dockerfile: src/plugin-runtime/Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    expose:
      - "8000"
    networks:
      - plugin_runtime
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      start_period: 2s
      retries: 3

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unnamed_tracking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-unnamed_tracking}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unnamed_tracking} -d ${POSTGRES_DB:-unnamed_tracking}"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  plugin_runtime:
    internal: true

volumes:
  pgdata:
