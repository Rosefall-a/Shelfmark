services:
  app:
    image: ghcr.io/rosefall-a/unnamed_tracking_app:${UNNAMED_TRACKING_APP_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${UNNAMED_TRACKING_APP_PORT:-8080}:80"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-unnamed_tracking}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-unnamed_tracking}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      PRIMARY_USER_USERNAME: ${PRIMARY_USER_USERNAME:-admin}
      PRIMARY_USER_EMAIL: ${PRIMARY_USER_EMAIL:-admin@example.invalid}
      PRIMARY_USER_PASSWORD: ${PRIMARY_USER_PASSWORD:?Set PRIMARY_USER_PASSWORD in .env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      PLUGIN_RUNTIME_URL: http://plugin-runtime:8000
      PLUGIN_GATEWAY_URL: http://app
      PLUGIN_RUNTIME_TOKEN: ${PLUGIN_RUNTIME_TOKEN:?Set PLUGIN_RUNTIME_TOKEN in .env}
    volumes:
      - ./data:/data
    networks:
      - core
      - plugin_gateway

  plugin-runtime-init:
    image: alpine:3.22
    command: ["sh", "-c", "mkdir -p /var/lib/unnamed-tracking/plugins && chown -R 10001:10001 /var/lib/unnamed-tracking/plugins"]
    user: "0:0"
    restart: "no"
    volumes:
      - plugin_data:/var/lib/unnamed-tracking/plugins

  plugin-runtime:
    build:
      context: ../..
      dockerfile: src/plugin-runtime/Dockerfile
    restart: unless-stopped
    depends_on:
      plugin-runtime-init:
        condition: service_completed_successfully
    environment:
      PLUGIN_RUNTIME_TOKEN: ${PLUGIN_RUNTIME_TOKEN:?Set PLUGIN_RUNTIME_TOKEN in .env}
      PLUGIN_RUNTIME_HOST: 0.0.0.0
      PLUGIN_RUNTIME_PORT: "8000"
      PLUGIN_RUNTIME_DISCORD_EGRESS: "true"
      NONBUBBLE_ENV: ${NONBUBBLE_ENV:-}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    expose:
      - "8000"
    volumes:
      - plugin_data:/var/lib/unnamed-tracking/plugins
    networks:
      - plugin_gateway
      - plugin_egress
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 3s
      start_period: 2s
      retries: 3

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unnamed_tracking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-unnamed_tracking}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unnamed_tracking} -d ${POSTGRES_DB:-unnamed_tracking}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - core

networks:
  core:
  plugin_gateway:
    internal: true
  plugin_egress:

volumes:
  pgdata:
  plugin_data:
