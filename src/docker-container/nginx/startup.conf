user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    server {
        listen 80;
        server_name _;

        # Serve index.html for ANY non-startup path (SPA fallback)
        root /srv/startup;

        # SPA fallback: ANY non-startup path → index.html
        location / {
            try_files /index.html =404;
        }

        # Redirect favicon to startup favicon
        location = /favicon.ico {
            log_not_found off;
            access_log off;
            return 302 /_startup/favicon.svg;
        }

        # --- Diagnostic files (served raw) ---
        location = /_startup/status.json {
            alias /run/unnamed-tracking/status.json;
            add_header Cache-Control "no-store";
        }

        location = /_startup/details.txt {
            alias /run/unnamed-tracking/details.txt;
            add_header Cache-Control "no-store";
        }

        location = /_startup/backend.log {
            alias /run/unnamed-tracking/backend.log;
            add_header Cache-Control "no-store";
        }

        # --- Static startup assets ---
        location = /_startup/startup.css {
            alias /srv/startup/startup.css;
        }

        location = /_startup/startup.js {
            alias /srv/startup/startup.js;
        }

        location = /_startup/favicon.svg {
            alias /srv/startup/favicon.svg;
        }

        # --- Startup page fallback ---
        # Anything under /_startup not matched above → startup.html
        location /_startup/ {
            alias /srv/startup/;
            try_files /startup.html =404;
        }

        location = /startup.html {
          alias /srv/startup/;
          try_files /startup.html =404;
        }

        location = /startup {
          alias /srv/startup/;
          try_files /startup.html =404;
        }
    }
}
