worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    error_log /dev/stderr warn;
    access_log off;
    sendfile on;

    server {
        listen 80;
        server_name _;

        location = /favicon.ico {
            log_not_found off;
            access_log off;
            return 302 /_startup/favicon.svg;
        }

        location = /_startup/status.json {
            alias /run/unnamed-tracking/status.json;
            add_header Cache-Control "no-store";
        }

        location = /_startup/details.txt {
            alias /run/unnamed-tracking/details.txt;
            add_header Cache-Control "no-store";
        }

        location = /_startup/backend.log {
            alias /run/unnamed-tracking/backend.log;
            add_header Cache-Control "no-store";
            default_type text/plain;
        }

        location = /_startup/migration.log {
            alias /run/unnamed-tracking/migration.log;
            add_header Cache-Control "no-store";
            default_type text/plain;
        }

        location = /_startup/startup.css {
            alias /srv/startup/;
            try_files /startup.css =404;
        }

        location = /_startup/startup.js {
            alias /srv/startup/;
            try_files /startup.js =404;
        }

        location = /_startup/startup.html {
            alias /srv/startup/;
            try_files /startup.html =404;
        }

        location = /startup.html {
          alias /srv/startup/;
          try_files /startup.html =404;
        }

        location = /startup {
          alias /srv/startup/;
          try_files /startup.html =404;
        }

        location /_startup/ {
            return 404;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            root /srv/frontend;
            try_files $uri $uri/ /index.html;
        }
    }
}
