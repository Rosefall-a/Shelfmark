worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    server {
        listen 80;
        server_name _;

        # --- Startup diagnostic assets (still available after ready) ---

        location = /favicon.ico {
            log_not_found off;
            access_log off;
            return 302 /_startup/favicon.svg;
        }

        location = /_startup/status.json {
            alias /run/unnamed-tracking/status.json;
            add_header Cache-Control "no-store";
        }

        location = /_startup/details.txt {
            alias /run/unnamed-tracking/details.txt;
            add_header Cache-Control "no-store";
        }

        location = /_startup/backend.log {
            alias /run/unnamed-tracking/backend.log;
            add_header Cache-Control "no-store";
        }

        location = /_startup/startup.css {
            alias /srv/startup/;
            try_files /startup.css =404;
        }

        location = /_startup/startup.js {
            alias /srv/startup/;
            try_files /startup.js =404;
        }

        # --- Block startup.html after READY ---
        # If user tries to access startup page, redirect them to the real app
        location = /_startup/startup.html {
            alias /srv/startup/;
            try_files /startup.html =404;
        }

        location = /startup.html {
          alias /srv/startup/;
          try_files /startup.html =404;
        }

        location = /startup {
          alias /srv/startup/;
          try_files /startup.html =404;
        }


        # --- Block all other startup assets except diagnostics ---
        location /_startup/ {
            return 404;
        }

        # --- Backend API ---
        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Production frontend (SPA) ---
        location / {
            root /srv/frontend;
            try_files $uri $uri/ /index.html;
        }
    }
}
