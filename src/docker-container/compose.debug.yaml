services:
  app:
    build: {context: ../.., dockerfile: ./src/docker-container/Dockerfile}
    image: unnamed_tracking_app:debug
    ports: ["127.0.0.1:${UNNAMED_TRACKING_DEBUG_PORT:-8081}:80"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unnamed_tracking_debug}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unnamed_tracking_debug}
      POSTGRES_DB: ${POSTGRES_DB:-unnamed_tracking_debug}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SECRET_KEY: ${SECRET_KEY:-debug-only-secret-key}
      PRIMARY_USER_USERNAME: ${PRIMARY_USER_USERNAME:-admin}
      PRIMARY_USER_EMAIL: ${PRIMARY_USER_EMAIL:-admin@example.invalid}
      PRIMARY_USER_PASSWORD: ${PRIMARY_USER_PASSWORD:-change-me-for-local-debug}
      AUTH_COOKIE_SECURE: "false"
      STARTUP_MODE: testing
      DEBUG: "true"
      PYTHONUNBUFFERED: "1"
    volumes: [debug_app_data:/data]
    depends_on: {db: {condition: service_healthy}}
    healthcheck: {test: ["CMD-SHELL", "curl -fsS http://localhost/health >/dev/null"], interval: 5s, timeout: 3s, retries: 30}
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unnamed_tracking_debug}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unnamed_tracking_debug}
      POSTGRES_DB: ${POSTGRES_DB:-unnamed_tracking_debug}
    volumes: [debug_pgdata:/var/lib/postgresql]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unnamed_tracking_debug} -d ${POSTGRES_DB:-unnamed_tracking_debug}"], interval: 3s, timeout: 3s, retries: 30}
volumes:
  debug_app_data:
  debug_pgdata:
